name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate README structure
        run: python tools/check_list.py
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run validator tests
        run: python -m pytest -q tools
